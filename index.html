<title>אהבתיה | בחירת שירים לחתונה</title>

<style>
/* ===== אהבתיה - טופס בחירת שירים ===== */
:root{
  --ink:#C2365F; --txt:#17111D; --sub:#5E5666; --lbl:#3A3340; --line:#E9E1DB; --card-line:#EEE7E2;
  --bg:#F7F4F2; --night:#120D17;
  --grad:linear-gradient(120deg,#EE6A2C 0%,#C23FA0 100%);
  --brand-grad:linear-gradient(135deg,#FAD45F 0%,#FA954A 100%);
  --soft-grad:linear-gradient(120deg,rgba(238,106,44,.12) 0%,rgba(194,63,160,.12) 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#EFEAE7;font-family:Heebo,system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(90% 38% at 100% 0%,rgba(250,149,74,.16) 0%,rgba(250,149,74,0) 70%),radial-gradient(80% 32% at 0% 0%,rgba(194,63,160,.10) 0%,rgba(194,63,160,0) 70%),var(--bg)}
.f-in{width:100%;height:54px;border:1.5px solid var(--line);border-radius:16px;padding:0 16px;font-size:17px;color:var(--txt);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.f-in:focus{border-color:#E8456A;box-shadow:0 0 0 4px rgba(232,69,106,.14)}
.f-in::placeholder{color:#7A7282}
.f-in.err{border-color:#C2365F}
textarea.f-in{height:130px;padding:14px 16px;resize:none;line-height:1.5}
input[type=tel].f-in{direction:ltr;text-align:right}
.field{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:500;color:var(--lbl)}
.req::after{content:" *";color:var(--ink)}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
.tap:active{transform:scale(.98)}
.tap:focus-visible{outline:3px solid rgba(194,54,95,.55);outline-offset:2px}
.tap:disabled{cursor:default}
.tap:disabled:active{transform:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen{animation:rise .35s ease-out}
h1,h2{margin:0;font-weight:800;letter-spacing:-.5px}
h2{font-size:29px;line-height:1.2}
p{margin:0}
.lead{font-size:16px;line-height:1.55;color:var(--sub)}
.stack{display:flex;flex-direction:column}
.card{border-radius:22px;background:#fff;border:1px solid var(--card-line);box-shadow:0 10px 30px rgba(23,17,29,.05);padding:18px;display:flex;flex-direction:column;gap:14px}
.card-title{font-size:17px;font-weight:700}
.hint{font-size:14px;color:var(--sub)}
.opt{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(#E9E1DB,#E9E1DB) border-box;box-shadow:0 1px 2px rgba(23,17,29,.04);color:var(--txt)}
.opt.on{background:linear-gradient(#FFF5F2,#FFF5F2) padding-box,var(--grad) border-box;box-shadow:0 10px 28px rgba(232,69,106,.18);color:var(--ink)}
.pill{border-width:1.5px;border-radius:22px;min-height:44px;padding:6px 15px;font-size:15px;font-weight:500}
.ring{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid #B4ABBA;display:flex;align-items:center;justify-content:center}
.on .ring{border-color:transparent;background:var(--grad)}
.on .ring::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.icon{display:flex;align-items:center;justify-content:center;background:#F5EFEB;color:var(--ink)}
.on .icon{background:var(--grad);color:#fff}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.footer{position:sticky;bottom:0;padding:12px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid rgba(23,17,29,.06);background:rgba(247,244,242,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn-main{width:100%;height:58px;border-radius:29px;font-size:19px;font-weight:700;color:#fff;background:var(--grad);box-shadow:0 12px 30px rgba(232,69,106,.35)}
.btn-main:disabled{background:#E7E1E4;color:#857C8C;box-shadow:none}
.missing{font-size:13px;color:var(--sub);text-align:center;margin-top:8px;min-height:18px}
.link-btn{align-self:flex-start;height:44px;padding:0 4px;background:transparent;color:var(--ink);font-size:16px;font-weight:700;text-decoration:underline;text-underline-offset:4px}
.toggle-track{width:52px;height:32px;flex:none;border-radius:16px;background:#DDD5DB;display:flex;align-items:center;justify-content:flex-start;padding:0 4px;transition:background .2s}
.toggle-track.on{background:var(--grad);justify-content:flex-end}
.toggle-track span{width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(23,17,29,.2)}
.welcome,.done{flex:1;position:relative;display:flex;flex-direction:column;color:#fff;background-color:var(--night);background-size:cover;background-position:center top;min-height:100vh;min-height:100dvh}
.welcome .shade,.done .shade{position:absolute;inset:0;pointer-events:none}
.welcome .inner{position:relative;flex:1;display:flex;flex-direction:column;padding:52px 28px calc(32px + env(safe-area-inset-bottom))}
.err-box{border-radius:16px;background:#FDECEF;border:1px solid #F3B6C4;color:#7A1730;padding:12px 14px;font-size:15px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

function qp(k){ return (q.get(k) || '').trim(); }
function toIsoDate(s){ // DD/MM/YYYY -> YYYY-MM-DD
  var m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(s || '');
  if (!m) return /^\d{4}-\d{2}-\d{2}$/.test(s || '') ? s : '';
  return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
}

/* ================= עזרים ================= */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function t(s){ return (s || '').trim(); }
function B(){ return t(S.bride) || 'הכלה'; }
function G(){ return t(S.groom) || 'החתן'; }
function phoneOk(p){
  var d = (p || '').replace(/\D/g, '');
  if (d.indexOf('972') === 0) d = '0' + d.slice(3);
  return /^0(5\d{8}|[2-489]\d{7}|7\d{8})$/.test(d);
}
function curStep(){ return STEPS[S.step]; }

function go(i){
  S.step = i; S.showAll = false; S.query = ''; S.triedNext = false; S.error = '';
  render(); window.scrollTo(0, 0);
}

/* ================= בדיקת שלב ================= */
function missing(step){
  var m = [];
  if (step === 'who' && !S.who) m.push('מי ממלא');
  if (step === 'names'){ if (!t(S.bride)) m.push('שם הכלה'); if (!t(S.groom)) m.push('שם החתן'); }
  if (step === 'package' && !S.pkg) m.push('סוג החבילה');
  if (step === 'event'){
    if (!S.date) m.push('תאריך'); if (!t(S.venue)) m.push('אולם');
    if (!S.reception) m.push('שעת קבלת פנים'); if (!S.chuppah) m.push('שעת חופה');
  }
  if (step === 'team'){
    if (t(S.escortPhone) && !phoneOk(S.escortPhone)) m.push('טלפון המלווה של ' + B());
    if (t(S.gEscortPhone) && !phoneOk(S.gEscortPhone)) m.push('טלפון המלווה של ' + G());
    if (S.hasProd && t(S.prodPhone) && !phoneOk(S.prodPhone)) m.push('טלפון המפיק');
    if (t(S.djPhone) && !phoneOk(S.djPhone)) m.push('טלפון הדי־ג׳יי');
  }
  if (step === 'phones'){
    if (!phoneOk(S.bridePhone)) m.push('הטלפון של ' + B());
    if (!phoneOk(S.groomPhone)) m.push('הטלפון של ' + G());
    if (!S.payer) m.push('איש קשר לתשלום');
    if (S.payer === 'other'){ if (!t(S.payName)) m.push('שם איש הקשר לתשלום'); if (!phoneOk(S.payPhone)) m.push('הטלפון שלו'); }
  }
  if (MOMENTS.indexOf(step) >= 0){
    var sel = S.songs[step];
    if (!sel || (sel === '__other' && !t(S.other[step]))) m.push('שיר');
  }
  return m;
}

function field(label, key, opts){
  opts = opts || {};
  var type = opts.type || 'text';
  var val = S[key];
  var bad = S.triedNext && opts.check && !opts.check(val);
  var attrs = 'class="f-in' + (bad ? ' err' : '') + '" data-field="' + key + '" type="' + type + '"' +
    (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') +
    (type === 'tel' ? ' inputmode="tel" autocomplete="tel"' : '') +
    (type === 'number' ? ' inputmode="numeric" min="0"' : '') +
    (opts.auto ? ' autocomplete="' + opts.auto + '"' : '');
  var control = type === 'textarea'
    ? '<textarea ' + attrs.replace(' type="textarea"', '') + '>' + esc(val) + '</textarea>'
    : '<input ' + attrs + ' value="' + esc(val) + '">';
  return '<label class="field"><span' + (opts.req ? ' class="req"' : '') + '>' + esc(label) + '</span>' + control + '</label>';
}
function head(title, lead){
  return '<div class="stack" style="gap:8px"><h2>' + esc(title) + '</h2>' + (lead ? '<p class="lead">' + esc(lead) + '</p>' : '') + '</div>';
}
function pills(key, list){
  return '<div class="chip-row">' + list.map(function(o){
    var on = S[key] === o.id;
    return '<button type="button" class="tap opt pill' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-act="pick" data-key="' + key + '" data-val="' + esc(o.id) + '">' + esc(o.label) + '</button>';
  }).join('') + '</div>';
}

function viewHeader(){
  var step = curStep();
  var mi = MOMENTS.indexOf(step);
  var ci = -1;
  CH.forEach(function(c, i){ if (c.steps.indexOf(step) >= 0) ci = i; });
  var label = mi >= 0 ? 'רגע ' + (mi + 1) + ' מתוך 5' : (ci >= 0 ? 'שלב ' + (ci + 1) + ' מתוך 5' : '');
  var bars = CH.map(function(c, i){
    var k = c.steps.indexOf(step);
    var pct = ci < 0 ? 0 : i < ci ? 100 : i > ci ? 0 : Math.round((k + 1) / c.steps.length * 100);
    return '<div class="stack" style="gap:6px"><div style="height:6px;border-radius:3px;background:#E9E1DB;overflow:hidden"><div style="height:6px;border-radius:3px;width:' + pct + '%;background:var(--grad);transition:width .3s"></div></div>' +
      '<div style="font-size:12px;text-align:center;color:' + (i === ci ? 'var(--ink)' : '#6F6777') + ';font-weight:' + (i === ci ? 700 : 500) + '">' + c.label + '</div></div>';
  }).join('');
  return '<header style="padding:14px 20px 12px" class="stack">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:12px">' +
      '<button type="button" class="tap" data-act="back" aria-label="חזרה" style="width:44px;height:44px;border-radius:22px;border:1px solid #EEE7E2;background:#fff;box-shadow:0 2px 8px rgba(23,17,29,.06);display:flex;align-items:center;justify-content:center;color:#17111D;padding:0">' + ICONS.back + '</button>' +
      '<div style="font-size:15px;font-weight:700;color:#3A3340">' + label + '</div><div style="width:44px"></div></div>' +
    '<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px">' + bars + '</div></header>';
}

function viewWho(){
  var opts = [{id:'groom',label:'החתן',icon:ICONS.groom},{id:'bride',label:'הכלה',icon:ICONS.bride}];
  return '<div class="stack screen" style="gap:22px;padding-top:12px">' + head('נעים להכיר! עם מי אנחנו מדברים?', 'ככה נדע איך לפנות אליכם לאורך הדרך.') +
    '<div class="grid2">' + opts.map(function(o){
      var on = S.who === o.id;
      return '<button type="button" class="tap opt' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-act="who" data-val="' + o.id + '" style="height:164px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:20px;font-weight:700">' +
        '<span class="icon" style="width:64px;height:64px;border-radius:50%">' + o.icon + '</span><span style="color:#17111D">' + o.label + '</span></button>';
    }).join('') + '</div></div>';
}

    list = qq ? all.filter(function(n){ return n.indexOf(qq) >= 0; }) : all;
  } else {
    list = step === 'glass' ? all.slice(0, 5).concat([NONE]) : all.slice(0, 6);
    if (sel && sel !== '__other' && list.indexOf(sel) < 0) list = [sel].concat(list);
  }

      '<div class="opt' + (oOn ? ' on' : '') + '" style="border-width:1.5px;border-radius:18px;display:flex;flex-direction:column">' +

/* ================= ציור ================= */
var app = document.getElementById('app');

function render(){
  var step = curStep();
  if (step === 'welcome'){ app.innerHTML = viewWelcome(); return; }
  if (step === 'done'){ app.innerHTML = viewDone(); return; }
  var body = '';
  if (step === 'who') body = viewWho();
  else if (step === 'names') body = viewNames();
  else if (step === 'package') body = viewPackage();
  else if (step === 'event') body = viewEvent();
  else if (step === 'team') body = viewTeam();
  else if (step === 'phones') body = viewPhones();
  else if (MOMENTS.indexOf(step) >= 0) body = viewMoment(step);
  else if (step === 'personal') body = viewPersonal();
  else if (step === 'summary') body = viewSummary();
  var miss = missing(step);
  var label = step === 'summary' ? (S.sending ? 'שולחים…' : 'שליחה') : step === 'personal' ? 'לסיכום' : 'המשך';
  // הכפתור פעיל עד הניסיון הראשון; אחרי ניסיון עם חוסרים הוא נעול עד שמשלימים
  var dis = S.sending || (S.triedNext && miss.length > 0);
  app.innerHTML = viewHeader() +
    '<main style="flex:1;padding:8px 20px 28px">' + body + '</main>' +
    '<div class="footer"><button type="button" class="tap btn-main" data-act="next"' + (dis ? ' disabled' : '') + '>' + label + '</button>' +
    '<div class="missing" role="status">' + (S.triedNext && miss.length ? 'חסר: ' + esc(miss.join(', ')) : '') + '</div></div>';
}

/* ================= אירועים ================= */
app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var act = el.getAttribute('data-act');
  var step = curStep();
  if (act === 'start') return go(1);
  if (act === 'back') return go(Math.max(0, S.step - 1));
  if (act === 'goto') return go(STEPS.indexOf(el.getAttribute('data-step')));
  if (act === 'who'){ S.who = el.getAttribute('data-val'); render(); setTimeout(function(){ if (curStep() === 'who') go(2); }, 280); return; }
  if (act === 'pick'){
    var k = el.getAttribute('data-key'), v = el.getAttribute('data-val');
    S[k] = (S[k] === v && (k === 'heard' || k === 'pause' || k === 'yichud')) ? '' : v;
    return render();
  }
  if (act === 'toggleProd'){ S.hasProd = !S.hasProd; return render(); }
  if (act === 'song'){ S.songs[step] = shownSongs[+el.getAttribute('data-i')]; return render(); }
  if (act === 'other'){ S.songs[step] = '__other'; render(); var o = app.querySelector('[data-other]'); if (o) o.focus(); return; }
  if (act === 'toggleAll'){ S.showAll = !S.showAll; S.query = ''; render(); if (S.showAll){ var s = app.querySelector('[data-field="query"]'); if (s) s.focus(); } return; }
  if (act === 'idea'){
    var n = IDEAS[+el.getAttribute('data-i')];
    var at = S.ideas.indexOf(n);
    if (at >= 0) S.ideas.splice(at, 1); else S.ideas.push(n);
    return render();
  }
  if (act === 'next'){
    if (missing(step).length){ S.triedNext = true; render(); var bad = app.querySelector('.f-in.err'); if (bad) bad.focus(); return; }
    if (step === 'summary') return submit();
    return go(Math.min(STEPS.length - 1, S.step + 1));
  }
});

// עדכון שדות בלי לאבד פוקוס
var REDRAW = {bride:1, groom:1, dj:1, query:1};
app.addEventListener('input', function(e){
  var el = e.target;
  var f = el.getAttribute('data-field');
  var o = el.getAttribute('data-other');
  if (f){ S[f] = el.value; }
  else if (o){ S.other[o] = el.value; }
  else return;
  if ((f && REDRAW[f]) || S.triedNext){
    var sel = null; try { sel = [el.selectionStart, el.selectionEnd]; } catch(err){}
    render();
    var again = app.querySelector(f ? '[data-field="' + f + '"]' : '[data-other="' + o + '"]');
    if (again){ again.focus(); try { if (sel && sel[0] != null) again.setSelectionRange(sel[0], sel[1]); } catch(err){} }
  }
});

/* ================= שליחה ================= */
function payload(){
  var payerName = '', payerPhone = '';
  if (S.payer === 'groom'){ payerName = t(S.groom); payerPhone = S.groomPhone; }
  if (S.payer === 'bride'){ payerName = t(S.bride); payerPhone = S.bridePhone; }
  if (S.payer === 'other'){ payerName = t(S.payName); payerPhone = S.payPhone; }
  var song = function(k){ var v = S.songs[k]; return v === '__other' ? t(S.other[k]) : v; };
  return {
    submissionId: submissionId,
    submittedAt: new Date().toISOString(),
    eventRecordId: eventRecordId,
    singer: singerKey,
    filledBy: S.who === 'bride' ? 'הכלה' : S.who === 'groom' ? 'החתן' : '',
    eventType: PKG[S.pkg] || '',
    groomName: t(S.groom), brideName: t(S.bride),
    weddingDate: S.date, hall: t(S.venue), guests: t(S.guests),
    receptionTime: S.reception, chuppahTime: S.chuppah,
    brideEscortName: t(S.escort), brideEscortPhone: t(S.escortPhone),
    groomEscortName: t(S.gEscort), groomEscortPhone: t(S.gEscortPhone),
    producerName: S.hasProd ? t(S.prod) : '', producerPhone: S.hasProd ? t(S.prodPhone) : '',
    djName: t(S.dj), djPhone: t(S.dj) ? t(S.djPhone) : '',
    bridePhone: t(S.bridePhone), groomPhone: t(S.groomPhone),
    payerName: payerName, payerPhone: t(payerPhone),
    songVeil: song('veil'), songBracha: song('bracha'), songEntrance: song('entrance'), songGlass: song('glass'), songEnding: song('ending'),
    glassPause: S.pause, escortToYichud: S.yichud,
    notes: t(S.notes),
    extraSongs: S.ideas.length ? 'שירים נוספים שאהבנו: ' + S.ideas.join(', ') : '',
    howMet: t(S.howMet), heardFrom: S.heard
  };
}

function submit(){
  if (S.sending) return;
  S.sending = true; S.error = ''; render();
  if (!LIVE){ // מצב תצוגה - לא שולחים כלום
    setTimeout(function(){ S.sending = false; go(STEPS.indexOf('done')); }, 600);
    return;
  }
  var data = payload();
  var body = new URLSearchParams();
  Object.keys(data).forEach(function(k){ body.append(k, data[k] == null ? '' : String(data[k])); });
  fetch(WEBHOOK_URL, { method:'POST', mode:'no-cors', body: body })
    .then(function(){ S.sending = false; go(STEPS.indexOf('done')); })
    .catch(function(){
      S.sending = false;
      S.error = 'משהו השתבש בשליחה. בדקו שיש חיבור לאינטרנט ונסו שוב. אם זה חוזר, כתבו לנו בוואטסאפ.';
      render();
    });
}

render();
})();
</script>
